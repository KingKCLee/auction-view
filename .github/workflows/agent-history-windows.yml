name: Auction Agent - Historical Windows Fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-history-windows.yml'
      - 'property-history-discovery-v2.js'
      - 'package.json'
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  history-windows:
    runs-on: windows-latest
    timeout-minutes: 14
    env:
      HISTORY_COURT_CODE: 'B000240'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        shell: bash
        run: npm install --no-audit --no-fund
      - name: Install Chromium fallback
        shell: bash
        run: npx playwright install chromium
      - name: Try historical property search from Windows runner
        shell: bash
        run: npm run history:property
      - name: Publish data if changed
        shell: bash
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs
          if ! git diff --cached --quiet; then
            git commit -m "data: windows historical fallback $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
