name: Auction Agent - Historical Windows Fallback

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  history-windows:
    runs-on: windows-latest
    timeout-minutes: 14
    env:
      HISTORY_COURT_CODE: 'B000240'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        shell: bash
        run: npm install --no-audit --no-fund
      - name: Install Chromium fallback
        shell: bash
        run: npx playwright install chromium
      - name: Try historical property search from Windows runner
        shell: bash
        run: npm run history:property
