name: Auction Agent - Nationwide Current Court Sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-current-court-sweep.yml'
      - 'current-court-sweep.js'
      - 'package.json'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  current-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CURRENT_SWEEP_COURTS: '4'
      CURRENT_SWEEP_NOTICES: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Install Chromium fallback
        run: npx playwright install chromium
      - name: Sweep current and next-month notices court by court
        run: |
          for i in 1 2 3; do
            echo "nationwide sweep pass $i/3"
            npm run sweep:current
            if [ "$i" != "3" ]; then sleep 20; fi
          done
      - name: Publish refreshed data
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs
          if ! git diff --cached --quiet; then
            git commit -m "data: nationwide current court sweep $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
