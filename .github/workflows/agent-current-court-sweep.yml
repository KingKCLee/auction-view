name: Auction Agent - Nationwide Current Court Sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-current-court-sweep.yml'
      - 'current-court-sweep.js'
      - 'fast-court-preload.js'
      - 'retry-worker.js'
      - 'detail-enrich.js'
      - 'photo-enrich.js'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  current-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CURRENT_SWEEP_COURTS: '8'
      CURRENT_SWEEP_NOTICES: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Sweep current and next-month notices court by court
        run: |
          for i in 1 2; do
            echo "nationwide fast sweep pass $i/2"
            node -r ./fast-court-preload.js current-court-sweep.js
            if [ "$i" != "2" ]; then sleep 10; fi
          done
      - name: Opportunistic official detail and photo enrichment
        run: |
          shard=$((10#$(date -u +%H) % 3))
          echo "safe enrichment shard ${shard}/2"
          timeout 45s env SHARD_COUNT=3 SHARD_INDEX=$shard BATCH_SIZE=1 npm run details || echo "detail route deferred to next cycle"
          timeout 45s env SHARD_COUNT=3 SHARD_INDEX=$shard BATCH_SIZE=1 npm run photos || echo "photo route deferred to next cycle"
      - name: Publish refreshed data
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs
          if [ -d photos ]; then git add photos; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: nationwide sweep with safe enrichment $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
