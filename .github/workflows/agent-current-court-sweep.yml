name: Auction Agent - Nationwide Current Court Sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-current-court-sweep.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  current-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      needs_rescue: ${{ steps.health.outputs.needs_rescue }}
    env:
      CURRENT_SWEEP_COURTS: '4'
      CURRENT_SWEEP_NOTICES: '3'
      BASIC_INFO_CASES: '4'
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Install Chromium for official browser fallback
        run: npx playwright install chromium

      - name: Merge safe laptop detail deltas first
        run: npm run worker:apply || true

      - name: Try official current sale-notice sweep
        run: npm run sweep:current || true

      - name: Fallback to official property search when notice sweep yields zero
        run: |
          need=$(node -e "const s=require('./data/stats.json'); const c=s.currentCourtSweep||{}; process.stdout.write(String(Number(c.successfulNotices||0)===0))")
          if [ "$need" = "true" ]; then
            timeout 120s npm run history:property || true
          fi

      - name: Fallback to official sale-notice discovery when both discovery paths yield zero
        run: |
          need=$(node -e "const s=require('./data/stats.json'); const c=s.currentCourtSweep||{}; const h=s.latestHistoryPropertyRun||{}; process.stdout.write(String(Number(c.successfulNotices||0)===0 && Number(h.returned||0)===0))")
          if [ "$need" = "true" ]; then
            timeout 120s npm run collect:once || true
          fi

      - name: Fill missing basic information through official case detail
        run: timeout 120s npm run basic || true

      - name: Verify basic information integrity
        run: npm run basic:validate

      - name: Recalculate metrics without deleting existing data
        run: node metrics-corrector.js || true

      - name: Decide whether a second hosted network should retry discovery
        id: health
        run: |
          need=$(node -e "const s=require('./data/stats.json'); const c=s.currentCourtSweep||{}; const h=s.latestHistoryPropertyRun||{}; const r=s.latestRun||{}; process.stdout.write(String(Number(c.successfulNotices||0)===0 && Number(h.returned||0)===0 && Number(r.items_found||0)===0))")
          echo "needs_rescue=$need" >> "$GITHUB_OUTPUT"

      - name: Publish only additive/enrichment result
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs data/worker-deltas 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: hourly safe discovery fallback $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  rescue-macos:
    needs: current-sweep
    if: needs.current-sweep.outputs.needs_rescue == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CURRENT_SWEEP_COURTS: '4'
      CURRENT_SWEEP_NOTICES: '3'
      BASIC_INFO_CASES: '4'
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Install Chromium for official browser fallback
        run: npx playwright install chromium
      - name: Retry official sale-notice sweep from a separate hosted network
        run: npm run sweep:current || true
      - name: Retry official property search if notices still yield zero
        run: |
          need=$(node -e "const s=require('./data/stats.json'); const c=s.currentCourtSweep||{}; process.stdout.write(String(Number(c.successfulNotices||0)===0))")
          if [ "$need" = "true" ]; then
            gtimeout 120s npm run history:property || npm run history:property || true
          fi
      - name: Merge worker deltas and verify basic info
        run: |
          npm run worker:apply || true
          npm run basic || true
          npm run basic:validate
          node metrics-corrector.js || true
      - name: Publish rescued additive result
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs data/worker-deltas 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: macOS safe discovery rescue $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
