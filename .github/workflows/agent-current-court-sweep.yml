name: Auction Agent - Nationwide Current Court Sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-current-court-sweep.yml'
      - 'current-court-sweep.js'
      - 'fast-court-preload.js'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: true

jobs:
  current-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CURRENT_SWEEP_COURTS: '4'
      CURRENT_SWEEP_NOTICES: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Sweep next nationwide court batch
        run: node -r ./fast-court-preload.js current-court-sweep.js
      - name: Publish this batch immediately
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs
          if ! git diff --cached --quiet; then
            git commit -m "data: nationwide current court batch $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
