name: Auction Agent - Nationwide Current Court Sweep (safe backup)

on:
  # [2026-09-17 대표님 지시] push 트리거를 껐다. 수동 실행만 남긴다.
  #
  # 왜: 경매 수집은 노트북에서만 돌리는 것이 원칙인데, 이 워크플로가
  # ops/collector-kick.txt 가 바뀔 때마다 GitHub Actions 에서 깨어나
  # "data: reconciled hourly discovery" 커밋으로 정본을 쓰고 있었다
  # (실측: 2026-09-15~17 사이 5회, 전부 push 이벤트).
  # kick 파일을 쓰는 코드는 이 리포에 없다 - 외부에서 대표님 계정으로
  # 밀어 넣는 경로였고 발신처는 특정하지 못했다(R3).
  #
  # 낙찰가 수집과 무관함을 먼저 확인하고 껐다: 이 워크플로가 전이적으로 부르는
  # 파일 22개 안에 detail-enrich.js 가 없고, 부르는 스크립트 어디에도 법원 낙찰
  # 응답 필드(dspslAmt / auctnDxdyRsltCd / gdsDspslDxdyLst)가 나오지 않는다.
  # 낙찰가를 실제로 수집하는 워크플로는 agent-enrichment-safe.yml 이고
  # (npm run details:once -> detail-enrich.js) 그 파일은 건드리지 않았다.
  #
  # 옛 push 경로(이력): branches [main] / paths =
  #   ops/collector-kick.txt · 이 워크플로 파일 · cycle-health.js ·
  #   test-cycle-health.js · test-macos-workflow-portability.js ·
  #   test-property-history-cursor.js · property-history-discovery-v2.js ·
  #   property-history-cursor-lib.js · reconcile-property-history-cursor.js ·
  #   run-bounded.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  current-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      needs_rescue: ${{ steps.health.outputs.needs_rescue }}
    env:
      CURRENT_SWEEP_COURTS: '1'
      CURRENT_SWEEP_NOTICES: '2'
      HISTORY_COURTS_PER_RUN: '1'
      HISTORY_NOTICES_PER_COURT: '1'
      BASIC_INFO_CASES: '4'
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Verify worker discovery addition guard
        run: node test-worker-additions.js
      - name: Verify current-cycle failover guard
        run: node test-cycle-health.js
      - name: Verify property-history cursor guard
        run: node test-property-history-cursor.js
      - name: Verify macOS rescue portability guard
        run: node test-macos-workflow-portability.js
      - name: Install Chromium for official browser fallback
        run: npx playwright install chromium

      - name: Merge safe laptop detail and discovery deltas first
        run: node apply-worker-deltas.js || true

      - name: Try official current sale-notice sweep with bounded time
        run: |
          if ! timeout -k 5s 150s node current-court-sweep.js; then
            node -e "const fs=require('fs');const p='./data/stats.json';const s=JSON.parse(fs.readFileSync(p));s.currentCourtSweep={...(s.currentCourtSweep||{}),processedNotices:0,successfulNotices:0,newUniqueItems:0,lastError:'current sale-notice sweep timed out after 150s; process group terminated; switching official route',finishedAt:new Date().toISOString()};fs.writeFileSync(p,JSON.stringify(s,null,2));"
          fi

      - name: Advance official historical sale notices when unique discovery stalls
        run: |
          need=$(node cycle-health.js needsBackfill)
          if [ "$need" = "true" ]; then
            echo "current notices added no unique items; advancing official sale-notice backfill"
            timeout -k 5s 120s node sale-notice-history-worker.js || true
          else
            echo "current notices added unique items; historical backfill can wait"
          fi

      - name: Fallback to official property search when current-cycle notice routes add no unique items
        run: |
          need=$(node cycle-health.js needsProperty)
          if [ "$need" = "true" ]; then
            timeout -k 5s 120s node property-history-discovery-v2.js || true
          fi

      - name: Fallback to official sale-notice discovery when current-cycle discovery remains empty
        run: |
          need=$(node cycle-health.js needsSaleDiscovery)
          if [ "$need" = "true" ]; then
            timeout -k 5s 120s node sale-notice-discovery.js || true
          fi

      - name: Fill missing basic information through official case detail
        run: timeout -k 5s 120s node basic-info-enrich.js || true

      - name: Verify basic information integrity
        run: node validate-basic-info.js

      - name: Recalculate metrics without deleting existing data
        run: node metrics-corrector.js || true

      - name: Decide whether a second hosted network should retry discovery
        id: health
        run: |
          need=$(node cycle-health.js needsRescue)
          echo "needs_rescue=$need" >> "$GITHUB_OUTPUT"
          node cycle-health.js json

      - name: Reconcile with latest canonical and publish additively
        run: |
          cp data/auctions.json /tmp/collector-auctions.json
          cp data/stats.json /tmp/collector-stats.json
          if [ -f data/state.json ]; then cp data/state.json /tmp/collector-state.json; else echo '{}' > /tmp/collector-state.json; fi
          if [ -f data/property-history-cursor.json ]; then cp data/property-history-cursor.json /tmp/collector-property-cursor.json; fi

          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          git pull --rebase origin main
          node safe-canonical-reconcile.js /tmp/collector-auctions.json /tmp/collector-stats.json /tmp/collector-state.json
          if [ -f /tmp/collector-property-cursor.json ]; then node reconcile-property-history-cursor.js /tmp/collector-property-cursor.json; fi
          node apply-worker-deltas.js || true
          node validate-basic-info.js
          node metrics-corrector.js || true

          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll

          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add -A data/auctions.json data/stats.json data/state.json data/property-history-cursor.json docs data/worker-deltas 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: reconciled hourly discovery $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
          fi

  rescue-macos:
    needs: current-sweep
    if: needs.current-sweep.outputs.needs_rescue == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CURRENT_SWEEP_COURTS: '1'
      CURRENT_SWEEP_NOTICES: '2'
      HISTORY_COURTS_PER_RUN: '1'
      HISTORY_NOTICES_PER_COURT: '1'
      BASIC_INFO_CASES: '4'
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Verify collector guards
        run: |
          node test-worker-additions.js
          node test-cycle-health.js
          node test-property-history-cursor.js
          node test-macos-workflow-portability.js
      - name: Install Chromium for official browser fallback
        run: npx playwright install chromium
      - name: Retry official sale-notice sweep from a separate hosted network
        run: node run-bounded.js 120000 node current-court-sweep.js || true
      - name: Advance official historical sale notices if current route is still stagnant
        run: |
          need=$(node cycle-health.js needsBackfill)
          if [ "$need" = "true" ]; then
            node run-bounded.js 120000 node sale-notice-history-worker.js || true
          fi
      - name: Retry official property search if current-cycle notice routes remain stagnant
        run: |
          need=$(node cycle-health.js needsProperty)
          if [ "$need" = "true" ]; then
            node run-bounded.js 120000 node property-history-discovery-v2.js || true
          fi
      - name: Retry official sale-notice discovery if all current-cycle discovery is still empty
        run: |
          need=$(node cycle-health.js needsSaleDiscovery)
          if [ "$need" = "true" ]; then
            node run-bounded.js 120000 node sale-notice-discovery.js || true
          fi
      - name: Merge worker deltas and verify basic info
        run: |
          node apply-worker-deltas.js || true
          node run-bounded.js 120000 node basic-info-enrich.js || true
          node validate-basic-info.js
          node metrics-corrector.js || true
      - name: Reconcile rescued result with latest canonical and publish
        run: |
          cp data/auctions.json /tmp/collector-auctions.json
          cp data/stats.json /tmp/collector-stats.json
          if [ -f data/state.json ]; then cp data/state.json /tmp/collector-state.json; else echo '{}' > /tmp/collector-state.json; fi
          if [ -f data/property-history-cursor.json ]; then cp data/property-history-cursor.json /tmp/collector-property-cursor.json; fi

          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          git pull --rebase origin main
          node safe-canonical-reconcile.js /tmp/collector-auctions.json /tmp/collector-stats.json /tmp/collector-state.json
          if [ -f /tmp/collector-property-cursor.json ]; then node reconcile-property-history-cursor.js /tmp/collector-property-cursor.json; fi
          node apply-worker-deltas.js || true
          node validate-basic-info.js
          node metrics-corrector.js || true

          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll

          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add -A data/auctions.json data/stats.json data/state.json data/property-history-cursor.json docs data/worker-deltas 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: reconciled macOS rescue $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
          fi
