name: Auction Agent - Stop Automatic Collection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-current-court-sweep.yml'

permissions:
  contents: read

concurrency:
  group: court-auction-global
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Automatic GitHub auction collection is being stopped."
