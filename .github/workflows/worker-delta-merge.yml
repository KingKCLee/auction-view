name: Auction Worker Delta Merge

on:
  push:
    branches: [main]
    paths:
      - 'data/worker-deltas/**'
      - '.github/workflows/worker-delta-merge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  merge-worker-deltas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install collector
        run: npm install --no-audit --no-fund

      - name: Apply available worker deltas without replacing canonical rows
        run: npm run worker:apply

      - name: Preserve merged result before canonical refresh
        run: |
          cp data/auctions.json /tmp/delta-auctions.json
          cp data/stats.json /tmp/delta-stats.json
          if [ -f data/state.json ]; then cp data/state.json /tmp/delta-state.json; else echo '{}' > /tmp/delta-state.json; fi

      - name: Reconcile against latest canonical and consume any newer deltas
        run: |
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          node safe-canonical-reconcile.js /tmp/delta-auctions.json /tmp/delta-stats.json /tmp/delta-state.json
          npm run worker:apply || true
          npm run basic:validate
          node metrics-corrector.js || true

      - name: Publish only additive reconciled data
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll

          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add -A data/auctions.json data/stats.json data/state.json docs data/worker-deltas 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: merge worker deltas $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
          fi
