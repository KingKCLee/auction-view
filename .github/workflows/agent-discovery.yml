name: Auction Agent - Discovery (legacy manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      DISCOVERY_STEPS: '1'
      FAILS_BEFORE_DEFER: '2'
      HISTORY_COURT_CODE: 'B000240'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Legacy discovery test
        run: npm run collect
