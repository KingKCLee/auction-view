name: Auction Agent - Historical Notices (manual backup)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HISTORY_COURTS_PER_RUN: '3'
      HISTORY_NOTICES_PER_COURT: '2'
      BASIC_INFO_CASES: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Install Chromium fallback
        run: npx playwright install chromium
      - name: Run one emergency history backfill
        run: npm run history:notices
      - name: Repair basic information
        run: npm run basic || true
      - name: Verify basic information
        run: npm run basic:validate
      - name: Publish emergency history batch
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs
          if ! git diff --cached --quiet; then
            git commit -m "data: manual emergency history backfill $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
