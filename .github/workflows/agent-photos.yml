name: Auction Agent - Photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-photos.yml'
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-global
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Collect official court auction photos
        run: npm run photos
      - name: Publish refreshed data and photos
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json docs photos
          if ! git diff --cached --quiet; then
            git commit -m "data: photo agent $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
