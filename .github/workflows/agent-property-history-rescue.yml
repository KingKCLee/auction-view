name: Auction Agent - Property History Cursor Rescue

on:
  push:
    branches: [main]
    paths:
      - 'ops/property-history-kick.txt'
      - '.github/workflows/agent-property-history-rescue.yml'
      - 'property-history-discovery-v2.js'
      - 'property-history-cursor-lib.js'
      - 'reconcile-property-history-cursor.js'
      - 'test-property-history-cursor.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-auction-property-history-rescue
  cancel-in-progress: false

jobs:
  property-history-rescue:
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --no-audit --no-fund
      - name: Verify monotonic cursor guard
        run: node test-property-history-cursor.js
      - name: Install Chromium for official property-search fallback
        run: npx playwright install chromium
      - name: Advance one bounded official property-search page/month
        run: node run-bounded.js 120000 node property-history-discovery-v2.js || true
      - name: Preserve additive collector snapshot
        run: |
          cp data/auctions.json /tmp/property-auctions.json
          cp data/stats.json /tmp/property-stats.json
          cp data/state.json /tmp/property-state.json
          if [ -f data/property-history-cursor.json ]; then cp data/property-history-cursor.json /tmp/property-cursor.json; fi
      - name: Reconcile with latest canonical without losing cursor progress
        run: |
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          node safe-canonical-reconcile.js /tmp/property-auctions.json /tmp/property-stats.json /tmp/property-state.json
          if [ -f /tmp/property-cursor.json ]; then node reconcile-property-history-cursor.js /tmp/property-cursor.json; fi
          node validate-basic-info.js
          node metrics-corrector.js || true
      - name: Publish only additive canonical changes
        run: |
          rm -rf docs
          mkdir -p docs/data
          cp index.html progress.html styles.css app.js progress.js docs/
          cp data/auctions.json data/stats.json docs/data/
          if [ -d photos ]; then cp -R photos docs/photos; fi
          touch docs/.nojekyll
          git config user.name "court-auction-bot"
          git config user.email "court-auction-bot@users.noreply.github.com"
          git add data/auctions.json data/stats.json data/state.json data/property-history-cursor.json docs
          if ! git diff --cached --quiet; then
            git commit -m "data: persist official property-history cursor $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
