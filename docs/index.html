<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집현전 법원경매 조회</title><link rel="stylesheet" href="styles.css"><style>.search-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 22px;box-shadow:0 8px 24px #1020300b}.search-main{display:grid;grid-template-columns:1fr 110px 110px;gap:10px;margin-bottom:12px}.search-main input{height:52px;border:2px solid #c9b184;border-radius:11px;padding:0 16px;font-size:15px;outline:none}.search-main input:focus{border-color:#9d7a40;box-shadow:0 0 0 3px #c8aa7222}.btn-search,.btn-reset{border:0;border-radius:11px;font-weight:800;cursor:pointer}.btn-search{background:#071b2e;color:#fff}.btn-reset{background:#eef1f3;color:#56616b}.search-filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.search-filters label{font-size:11px;color:#7b8791}.search-filters select{width:100%;height:42px;margin-top:5px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 9px}.quick-filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.quick-filters button{border:1px solid #ddd4c4;background:#fff;color:#725d38;border-radius:999px;padding:7px 11px;cursor:pointer;font-size:12px}.quick-filters button.active{background:#0b253c;color:#fff;border-color:#0b253c}.search-summary{display:flex;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid #edf0f2;color:#7b8791;font-size:12px}@media(max-width:850px){.search-main{grid-template-columns:1fr 90px}.search-main .btn-reset{grid-column:1/-1;height:42px}.search-filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.search-main{grid-template-columns:1fr}.btn-search,.btn-reset{height:44px}.search-filters{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="brand">집현전 <b>법원경매 DB</b></div><nav><a href="index.html">경매조회</a><a href="progress.html">수집진도</a></nav><div id="updated">데이터 로딩 중</div></header><section class="hero"><div><small>COURT AUCTION SEARCH</small><h1>경매 사건을<br><em>조건별로 검색합니다.</em></h1><p>사건번호 · 주소 · 연도 · 물건종류 · 낙찰여부 · 사진/문서 확보여부를 한 번에 조회합니다.</p></div></section><main><section id="stats" class="stats"></section><section class="search-panel"><div class="search-main"><input id="q" placeholder="사건번호, 주소, 건물명, 물건종류를 입력하세요"><button id="searchBtn" class="btn-search">검색</button><button id="resetBtn" class="btn-reset">초기화</button></div><div class="search-filters"><label>법원<select id="court"><option value="">전체 법원</option></select></label><label>사건 연도<select id="year"><option value="">전체 연도</option></select></label><label>물건 종류<select id="usage"><option value="">전체 유형</option></select></label><label>낙찰 상태<select id="result"><option value="">전체 결과</option><option value="won">낙찰가 있음</option><option value="open">낙찰 전/미확인</option></select></label><label>자료 보유<select id="asset"><option value="">전체</option><option value="photo">사진 있음</option><option value="document">문서 있음</option><option value="history">기일이력 있음</option></select></label></div><div class="quick-filters"><button data-quick="photo">사진 있는 물건</button><button data-quick="won">낙찰가 있는 물건</button><button data-quick="history">기일이력 있는 물건</button><button data-quick="current">최근 매각기일</button></div><div class="search-summary"><span>여러 조건을 동시에 선택할 수 있습니다.</span><strong id="searchCount">0건</strong></div></section><section class="layout"><div><div class="section-title"><h2>경매 물건 조회</h2><span id="count"></span></div><div id="list"></div></div><aside id="detail"><div class="empty">물건을 선택하면 상세정보와 기일 이력을 표시합니다.</div></aside></section></main><footer>GitHub Actions 자동수집 · 인천지방법원 파일럿 · <a href="progress.html">수집 진도 보기</a></footer><script src="app.js"></script></body></html>
