<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집현전 법원경매 조회</title><link rel="stylesheet" href="styles.css"><style>
.search-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 22px;box-shadow:0 8px 24px #1020300b}.search-main{display:grid;grid-template-columns:1fr 110px 110px;gap:10px;margin-bottom:14px}.search-main input{height:52px;border:2px solid #c9b184;border-radius:11px;padding:0 16px;font-size:15px;outline:none}.search-main input:focus{border-color:#9d7a40;box-shadow:0 0 0 3px #c8aa7222}.btn-search,.btn-reset{border:0;border-radius:11px;font-weight:800;cursor:pointer}.btn-search{background:#071b2e;color:#fff}.btn-reset{background:#eef1f3;color:#56616b}.filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}.field{font-size:11px;color:#7b8791}.field input,.field select{width:100%;height:42px;margin-top:5px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 9px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.type-box{margin-top:15px;border:1px solid #e4e8ec;border-radius:12px;overflow:hidden}.type-title{padding:10px 13px;background:#f7f8fa;font-size:12px;font-weight:800;color:#4e5c67}.type-columns{display:grid;grid-template-columns:repeat(4,1fr)}.type-group{padding:12px;border-right:1px solid #edf0f2}.type-group:last-child{border-right:0}.type-group b{display:block;color:#8a6d3e;font-size:12px;margin-bottom:8px}.type-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.type-checks label{font-size:11px;color:#596671;display:flex;gap:5px;align-items:center}.quick-filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.quick-filters button{border:1px solid #ddd4c4;background:#fff;color:#725d38;border-radius:999px;padding:7px 11px;cursor:pointer;font-size:12px}.quick-filters button.active{background:#0b253c;color:#fff;border-color:#0b253c}.search-summary{display:flex;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid #edf0f2;color:#7b8791;font-size:12px}.subtle{font-size:11px;color:#8a949d;margin-top:7px}@media(max-width:1000px){.filter-grid{grid-template-columns:repeat(2,1fr)}.type-columns{grid-template-columns:repeat(2,1fr)}.type-group:nth-child(2){border-right:0}}@media(max-width:650px){.search-main{grid-template-columns:1fr}.btn-search,.btn-reset{height:44px}.filter-grid,.type-columns{grid-template-columns:1fr}.type-group{border-right:0;border-bottom:1px solid #edf0f2}.type-group:last-child{border-bottom:0}}
</style></head><body><header><div class="brand">집현전 <b>법원경매 DB</b></div><nav><a href="index.html">경매조회</a><a href="progress.html">수집진도</a></nav><div id="updated">데이터 로딩 중</div></header><section class="hero"><div><small>COURT AUCTION SEARCH</small><h1>지역부터 용도까지<br><em>상세조건으로 검색합니다.</em></h1><p>최신 진행물건을 먼저 수집하고, 이후 과거자료를 순차적으로 확장합니다.</p></div></section><main><section id="stats" class="stats"></section>
<section class="search-panel">
 <div class="search-main"><input id="q" placeholder="사건번호, 주소, 건물명, 물건종류 키워드"><button id="searchBtn" class="btn-search">검색</button><button id="resetBtn" class="btn-reset">초기화</button></div>
 <div class="filter-grid">
  <label class="field">시·도<select id="sido"><option value="">전국</option></select></label>
  <label class="field">시·군·구<select id="sigungu"><option value="">전체 시군구</option></select></label>
  <label class="field">법원<select id="court"><option value="">전체 법원</option></select></label>
  <label class="field">경매종류<select id="auctionType"><option value="">전체</option><option>임의경매</option><option>강제경매</option><option>형식적경매</option></select></label>
  <label class="field">매각기일<div class="pair"><input id="dateFrom" type="date"><input id="dateTo" type="date"></div></label>
  <label class="field">사건번호<div class="pair"><select id="year"><option value="">연도 전체</option></select><input id="caseNo" placeholder="번호"></div></label>
  <label class="field">감정가(원)<div class="pair"><input id="appMin" inputmode="numeric" placeholder="최소"><input id="appMax" inputmode="numeric" placeholder="최대"></div></label>
  <label class="field">최저가(원)<div class="pair"><input id="minMin" inputmode="numeric" placeholder="최소"><input id="minMax" inputmode="numeric" placeholder="최대"></div></label>
  <label class="field">유찰횟수<select id="failed"><option value="">전체</option><option value="0">0회</option><option value="1">1회 이상</option><option value="2">2회 이상</option><option value="3">3회 이상</option><option value="5">5회 이상</option></select></label>
  <label class="field">건물면적(㎡)<div class="pair"><input id="buildingMin" inputmode="decimal" placeholder="최소"><input id="buildingMax" inputmode="decimal" placeholder="최대"></div></label>
  <label class="field">토지면적(㎡)<div class="pair"><input id="landMin" inputmode="decimal" placeholder="최소"><input id="landMax" inputmode="decimal" placeholder="최대"></div></label>
  <label class="field">건물명<input id="building" placeholder="아파트·오피스텔명"></label>
  <label class="field">진행/낙찰상태<select id="result"><option value="">전체</option><option value="open">진행·미확인</option><option value="won">낙찰가 있음</option><option value="failed">유찰</option><option value="changed">변경·연기</option><option value="withdrawn">취하</option></select></label>
  <label class="field">자료 보유<select id="asset"><option value="">전체</option><option value="photo">사진 있음</option><option value="history">기일이력 있음</option><option value="statement">매각물건명세서 있음</option><option value="report">현황조사서 있음</option><option value="appraisal">감정평가요항 있음</option><option value="document">문서정보 있음</option></select></label>
  <label class="field">정렬<select id="sort"><option value="latest">매각기일 최신순</option><option value="soon">매각기일 가까운순</option><option value="appHigh">감정가 높은순</option><option value="minLow">최저가 낮은순</option><option value="winHigh">낙찰가 높은순</option></select></label>
 </div>
 <div class="type-box"><div class="type-title">물건종류 · 복수선택 가능</div><div class="type-columns">
  <div class="type-group"><b>주거용 부동산</b><div class="type-checks"><label><input type="checkbox" name="ptype" value="아파트">아파트</label><label><input type="checkbox" name="ptype" value="주택">주택</label><label><input type="checkbox" name="ptype" value="다세대">다세대/빌라</label><label><input type="checkbox" name="ptype" value="다가구">다가구</label><label><input type="checkbox" name="ptype" value="오피스텔">오피스텔</label><label><input type="checkbox" name="ptype" value="연립">연립주택</label><label><input type="checkbox" name="ptype" value="도시형">도시형생활주택</label><label><input type="checkbox" name="ptype" value="근린주택">근린주택</label></div></div>
  <div class="type-group"><b>상업용 부동산</b><div class="type-checks"><label><input type="checkbox" name="ptype" value="근린시설">근린시설</label><label><input type="checkbox" name="ptype" value="상가">상가</label><label><input type="checkbox" name="ptype" value="사무실">사무실</label><label><input type="checkbox" name="ptype" value="공장">공장</label><label><input type="checkbox" name="ptype" value="창고">창고</label><label><input type="checkbox" name="ptype" value="숙박">숙박시설</label><label><input type="checkbox" name="ptype" value="주상복합">주상복합</label><label><input type="checkbox" name="ptype" value="판매시설">판매시설</label></div></div>
  <div class="type-group"><b>토지</b><div class="type-checks"><label><input type="checkbox" name="ptype" value="대지">대지</label><label><input type="checkbox" name="ptype" value="전">전</label><label><input type="checkbox" name="ptype" value="답">답</label><label><input type="checkbox" name="ptype" value="임야">임야</label><label><input type="checkbox" name="ptype" value="과수원">과수원</label><label><input type="checkbox" name="ptype" value="목장">목장용지</label><label><input type="checkbox" name="ptype" value="도로">도로</label><label><input type="checkbox" name="ptype" value="주차장">주차장</label></div></div>
  <div class="type-group"><b>기타</b><div class="type-checks"><label><input type="checkbox" name="ptype" value="자동차">자동차</label><label><input type="checkbox" name="ptype" value="선박">선박</label><label><input type="checkbox" name="ptype" value="광업권">광업권</label><label><input type="checkbox" name="ptype" value="어업권">어업권</label><label><input type="checkbox" name="ptype" value="기계">기계/설비</label><label><input type="checkbox" name="ptype" value="기타">기타</label></div></div>
 </div></div>
 <div class="quick-filters"><button data-quick="photo">사진 있는 물건</button><button data-quick="won">낙찰가 있는 물건</button><button data-quick="history">기일이력 있는 물건</button><button data-quick="current">최근 90일</button></div>
 <div class="search-summary"><span>지역·가격·면적·용도 등 여러 조건을 동시에 적용할 수 있습니다.</span><strong id="searchCount">0건</strong></div>
</section>
<section class="layout"><div><div class="section-title"><h2>경매 물건 조회</h2><span id="count"></span></div><div id="list"></div></div><aside id="detail"><div class="empty">물건을 선택하면 사진, 기일이력, 낙찰결과, 감정정보를 표시합니다.</div></aside></section></main><footer>공식 법원경매정보 자동수집 · 최신물건 우선 · <a href="progress.html">수집 진도 보기</a></footer><script src="app.js"></script></body></html>
